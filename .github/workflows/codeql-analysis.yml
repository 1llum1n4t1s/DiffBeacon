name: CodeQL Analysis

# 解析は既定ブランチとPRで行い、作業ブランチの各pushでは回さない。定期実行は週1回にする。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Src/DiffBeacon.*/**'
      - 'tests/DiffBeacon.*/**'
      - '*.slnx'
      - 'Directory.Build.*'
      - '**/packages.lock.json'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    paths:
      - 'Src/DiffBeacon.*/**'
      - 'tests/DiffBeacon.*/**'
      - '*.slnx'
      - 'Directory.Build.*'
      - '**/packages.lock.json'
      - '.github/workflows/codeql-analysis.yml'
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build application
        run: dotnet build DiffBeacon.slnx -c Release
      - uses: github/codeql-action/analyze@v4
