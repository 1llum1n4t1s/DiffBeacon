name: .NET CI

# 検証専用のCI。配布物はWindowsをこのPCで署名付きビルドし、macOSはM3MB14でビルドするため、
# CIの発行物は配布に使わない。作業ブランチへのpushはwin-x64だけで素早く確認し、
# 全構成（win-arm64・osx-arm64を含む）はmasterへのpush、PR、手動実行、週1回の定期実行で回す。
#
# 所要時間を抑えるため、同じ検査を二度流さない・同じコードの網羅を全構成で繰り返さない。
# - 全体自己検証は、E2Eの限定selectorが独立readerと一緒に同じ検査を実行する単位を省く（-SkipE2ECoveredSelfTest）。
# - 式評価などOS非依存の網羅オラクルは、全構成を回す実行のwin-x64だけで全件（--oracles full）流す。
#   win-arm64・osx-arm64と、作業ブランチのpushは代表だけの smoke とし、省いた単位は skipped としてE2Eの結果に残る。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
  push:
    # 製品・検証・CIに影響しない変更（文書、旧WinMergeの参照用ディレクトリ）ではCIを起動しない。
    # 後勝ちなので、Src配下はDiffBeacon.*だけを対象へ戻す。fixtureのREADMEはSHA固定されているため除外しない。
    paths:
      - '**'
      - '!*.md'
      - '!Docs/**'
      - '!Src/**'
      - 'Src/DiffBeacon.*/**'
      - '!Src/DiffBeacon.*/**/*.md'
      - '!ArchiveSupport/**'
      - '!ColorSchemes/**'
      - '!Filters/**'
      - '!Installer/**'
      - '!Plugins/**'
      - '!ShellExtension/**'
      - '!Testing/**'
      - '!Tools/**'
      - '!Translations/**'
  pull_request:
    # pushと同じ対象。YAMLアンカーに頼らず明示的に複製する。
    paths:
      - '**'
      - '!*.md'
      - '!Docs/**'
      - '!Src/**'
      - 'Src/DiffBeacon.*/**'
      - '!Src/DiffBeacon.*/**/*.md'
      - '!ArchiveSupport/**'
      - '!ColorSchemes/**'
      - '!Filters/**'
      - '!Installer/**'
      - '!Plugins/**'
      - '!ShellExtension/**'
      - '!Testing/**'
      - '!Tools/**'
      - '!Translations/**'

permissions:
  contents: read

# 同じrefの古いrunは新しいpushで打ち切る（定期実行は打ち切らない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # 全構成で検証するか。作業ブランチへのpushだけfalseになる。
  DIFFBEACON_FULL_MATRIX: ${{ github.event_name != 'push' || github.ref == 'refs/heads/master' }}

jobs:
  build-and-verify:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Native AOT / ${{ matrix.rid }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/master') && '[{"rid":"win-x64","runs-on":["windows-2025"],"oracles":"full"},{"rid":"win-arm64","runs-on":["windows-11-arm"],"oracles":"smoke"},{"rid":"osx-arm64","runs-on":["self-hosted","macOS","ARM64","m3mb14"],"oracles":"smoke"}]' || '[{"rid":"win-x64","runs-on":["windows-2025"],"oracles":"smoke"}]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          # 固定readerは履歴上の原典コミット（例: 6780924ba）のblobを `git rev-parse <commit>:<path>` で照合する。
          # 浅いcheckoutではそのコミットが無いため、全履歴（pack約111MiB）を取得する。
          fetch-depth: 0
      # optimizer等の固定期待値は、ローカル日時をUTC+9（Tokyo、夏時間なし）で解釈して採取した。
      # GitHubのWindows runnerはUTCなので、採取時と同じタイムゾーンへ切り替える。
      # ja-JP／LCID1041まで要求する暦関数スイートは、locale不一致のため従来どおり理由付きでskipされる。
      - name: Use the captured Tokyo time zone
        if: runner.os == 'Windows'
        run: |
          tzutil /s "Tokyo Standard Time"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tzutil /g
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      # self-hosted macOS（M3MB14）では、setup-python の配布物が /Users/runner/hostedtoolcache 固定で展開できず、
      # AGENT_TOOLSDIRECTORY の変更でも回避できなかった。システムの python3 は3.9と古いため、
      # uv で3.13の仮想環境を作って有効化し、E2E と証拠記録が使う `python` をそれに向ける。
      - uses: astral-sh/setup-uv@v6
        if: runner.environment != 'github-hosted'
        with:
          python-version: '3.13'
          activate-environment: true
      - name: Show verification Python
        run: python --version
      - name: Select external run output
        run: |
          $runRoot = Join-Path $env:RUNNER_TEMP 'Codex/DiffBeacon/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}'
          "DIFFBEACON_RUN_ROOT=$runRoot" >> $env:GITHUB_ENV
      - name: Build verification projects
        run: |
          dotnet build tests/DiffBeacon.E2E/DiffBeacon.E2E.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/DiffBeacon.FakeProvider/DiffBeacon.FakeProvider.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify macOS SDK file kind ABI
        if: startsWith(matrix.rid, 'osx-')
        run: pwsh -NoProfile -File build/Build-FolderMacReference.ps1 -OutputDirectory '${{ env.DIFFBEACON_RUN_ROOT }}/folder-reference'
      - name: Publish and verify native application
        run: |
          # Windowsの全体Native AOT自己検証も10分を超えるため、4構成に20分の有限枠を使う。
          $timeoutSeconds = 1200
          # 中間出力も同じrun root配下へ置く。省略するとGetTempPath()になり、macOSの /var はリンクなので拒否される。
          ./build/Publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -OutputRoot (Join-Path $env:DIFFBEACON_RUN_ROOT 'publish') -BuildArtifactsPath (Join-Path $env:DIFFBEACON_RUN_ROOT 'build') -VerificationTimeoutSeconds $timeoutSeconds -SkipE2ECoveredSelfTest
      - name: Build independent Z decoder for verification
        run: |
          pwsh -NoProfile -File build/Build-ZReference.ps1 -OutputDirectory '${{ env.DIFFBEACON_RUN_ROOT }}/z-reference'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run end-to-end scenarios
        run: |
          $manifest = Get-Content '${{ env.DIFFBEACON_RUN_ROOT }}/publish/${{ matrix.rid }}/publish-manifest.json' -Raw | ConvertFrom-Json
          $decoderName = if ($IsWindows) { 'ncompress.exe' } else { 'ncompress' }
          $zReference = (Resolve-Path -LiteralPath (Join-Path '${{ env.DIFFBEACON_RUN_ROOT }}/z-reference' $decoderName)).Path
          dotnet run --project tests/DiffBeacon.E2E/DiffBeacon.E2E.csproj -c Release --no-build -- --output '${{ env.DIFFBEACON_RUN_ROOT }}/e2e' --app $manifest.executable --z-reference $zReference --oracles ${{ matrix.oracles }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 実OSクリップボードの別プロセス検証はクリーンなGitHub提供runnerに限る。
      # self-hosted（M3MB14）は利用者の実機で、検証用に利用者のクリップボードを置換しない。
      - name: Verify actual OS clipboard across application processes
        if: runner.environment == 'github-hosted'
        run: |
          $manifest = Get-Content '${{ env.DIFFBEACON_RUN_ROOT }}/publish/${{ matrix.rid }}/publish-manifest.json' -Raw | ConvertFrom-Json
          & $manifest.executable --clipboard-self-test '${{ env.DIFFBEACON_RUN_ROOT }}/verification/desktop-clipboard' --write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test '${{ env.DIFFBEACON_RUN_ROOT }}/verification/desktop-clipboard' --read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test '${{ env.DIFFBEACON_RUN_ROOT }}/verification/desktop-binary-clipboard' --binary-write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test '${{ env.DIFFBEACON_RUN_ROOT }}/verification/desktop-binary-clipboard' --binary-read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record evidence directories and file hashes before upload
        if: always()
        run: |
          python -B build/Capture-EvidenceInventory.py --base-directory '${{ env.DIFFBEACON_RUN_ROOT }}' --root e2e --root verification --root 'publish/verification/${{ matrix.rid }}' --root z-reference --root folder-reference --root 'publish/${{ matrix.rid }}/publish-manifest.json' --output evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.rid }}
          path: |
            ${{ env.DIFFBEACON_RUN_ROOT }}/e2e/
            ${{ env.DIFFBEACON_RUN_ROOT }}/verification/
            ${{ env.DIFFBEACON_RUN_ROOT }}/publish/verification/${{ matrix.rid }}/
            ${{ env.DIFFBEACON_RUN_ROOT }}/publish/${{ matrix.rid }}/publish-manifest.json
            ${{ env.DIFFBEACON_RUN_ROOT }}/z-reference/
            ${{ env.DIFFBEACON_RUN_ROOT }}/folder-reference/
            ${{ env.DIFFBEACON_RUN_ROOT }}/evidence.json
          if-no-files-found: warn
      # 配布物はローカルで作るため、発行物の保存は全構成のrunに限る（作業ブランチのpushでは保存しない）。
      - name: Upload native application
        if: env.DIFFBEACON_FULL_MATRIX == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DiffBeacon-${{ matrix.rid }}
          path: ${{ env.DIFFBEACON_RUN_ROOT }}/publish/${{ matrix.rid }}/
          if-no-files-found: error
