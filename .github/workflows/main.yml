name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Native AOT / ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build managed projects
        run: dotnet build DiffBeacon.slnx -c Release
      - name: Publish and verify native application
        run: ./build/Publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Run end-to-end scenarios
        run: |
          $manifest = Get-Content 'artifacts/publish/${{ matrix.rid }}/publish-manifest.json' -Raw | ConvertFrom-Json
          dotnet run --project tests/DiffBeacon.E2E/DiffBeacon.E2E.csproj -c Release --no-build -- --output 'artifacts/e2e/${{ matrix.rid }}' --app $manifest.executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.rid }}
          path: |
            artifacts/e2e/${{ matrix.rid }}/
            artifacts/verification/${{ matrix.rid }}/
            artifacts/publish/${{ matrix.rid }}/publish-manifest.json
          if-no-files-found: warn
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/
          if-no-files-found: error
