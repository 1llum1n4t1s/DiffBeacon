name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Native AOT / ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build managed projects
        run: dotnet build DiffBeacon.slnx -c Release
      - name: Publish and verify native application
        run: ./build/Publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Build independent Z decoder for verification
        run: |
          pwsh -NoProfile -File build/Build-ZReference.ps1 -OutputDirectory 'artifacts/z-reference/${{ matrix.rid }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run end-to-end scenarios
        run: |
          $manifest = Get-Content 'artifacts/publish/${{ matrix.rid }}/publish-manifest.json' -Raw | ConvertFrom-Json
          $decoderName = if ($IsWindows) { 'ncompress.exe' } else { 'ncompress' }
          $zReference = (Resolve-Path -LiteralPath (Join-Path 'artifacts/z-reference/${{ matrix.rid }}' $decoderName)).Path
          dotnet run --project tests/DiffBeacon.E2E/DiffBeacon.E2E.csproj -c Release --no-build -- --output 'artifacts/e2e/${{ matrix.rid }}' --app $manifest.executable --z-reference $zReference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual OS clipboard across application processes
        run: |
          $manifest = Get-Content 'artifacts/publish/${{ matrix.rid }}/publish-manifest.json' -Raw | ConvertFrom-Json
          & $manifest.executable --clipboard-self-test 'artifacts/verification/${{ matrix.rid }}/desktop-clipboard' --write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test 'artifacts/verification/${{ matrix.rid }}/desktop-clipboard' --read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test 'artifacts/verification/${{ matrix.rid }}/desktop-binary-clipboard' --binary-write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $manifest.executable --clipboard-self-test 'artifacts/verification/${{ matrix.rid }}/desktop-binary-clipboard' --binary-read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record evidence directories and file hashes before upload
        if: always()
        run: |
          python -B build/Capture-EvidenceInventory.py --root 'artifacts/e2e/${{ matrix.rid }}' --root 'artifacts/verification/${{ matrix.rid }}' --root 'artifacts/z-reference/${{ matrix.rid }}' --root 'artifacts/publish/${{ matrix.rid }}/publish-manifest.json' --output 'artifacts/evidence/${{ matrix.rid }}.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.rid }}
          path: |
            artifacts/e2e/${{ matrix.rid }}/
            artifacts/verification/${{ matrix.rid }}/
            artifacts/publish/${{ matrix.rid }}/publish-manifest.json
            artifacts/z-reference/${{ matrix.rid }}/
            artifacts/evidence/${{ matrix.rid }}.json
          if-no-files-found: warn
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/
          if-no-files-found: error
